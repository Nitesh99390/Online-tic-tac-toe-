<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#05070a">
    <title>Nitesh Titan | Quantum Polished</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
        href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" 
        rel="stylesheet"
    >
    
    <style>
        /* ==========================================================================
           [01] ADVANCED DESIGN TOKENS (CSS VARIABLES)
           ========================================================================== */
        :root {
            /* Branding Colors */
            --wtr-color-bg: #05070a;
            --wtr-grid-color: #5f6a6d; /* Image 1 Strict Match */
            --wtr-color-x: #ff4757;
            --wtr-color-o: #2ed573;
            --wtr-color-gold: #fbbf24;
            --wtr-color-danger: #ff3333;
            
            /* Glassmorphism Design */
            --wtr-glass-bg: rgba(10, 15, 20, 0.85);
            --wtr-glass-border: rgba(255, 255, 255, 0.08);
            --wtr-glass-blur: blur(25px);
            
            /* Shadows & Effects */
            --wtr-shadow-heavy: 0 30px 60px rgba(0,0,0,0.9);
            --wtr-glow-gold: 0 0 30px rgba(251, 191, 36, 0.3);
            
            /* Typography */
            --wtr-font-brand: 'Permanent Marker', cursive;
            --wtr-font-main: 'Poppins', sans-serif;
            --wtr-font-code: 'JetBrains Mono', monospace;
        }

        /* ==========================================================================
           [02] GLOBAL ARCHITECTURE & DYNAMIC BG
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: var(--wtr-color-bg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: var(--wtr-font-main);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background-image 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Static Overlay for Readability */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%);
            z-index: -1;
        }

        /* Custom Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--wtr-glass-border);
            border-radius: 10px;
        }

        /* ==========================================================================
           [03] WTR SPLASH ENGINE
           ========================================================================== */
        #splash-sequence {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s var(--wtr-glass-blur);
        }

        .quantum-loader {
            width: 140px;
            height: 140px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border: 4px solid transparent;
            border-radius: 50%;
            animation: loader-spin 2s linear infinite;
        }

        .loader-ring-outer {
            border-top-color: var(--wtr-color-gold);
            border-bottom-color: var(--wtr-color-gold);
            box-shadow: var(--wtr-glow-gold);
        }

        .loader-ring-inner {
            inset: 20px;
            border-left-color: var(--wtr-color-x);
            border-right-color: var(--wtr-color-o);
            animation-direction: reverse;
            animation-duration: 1.2s;
        }

        @keyframes loader-spin {
            100% { transform: rotate(360deg); }
        }

        .branding-text {
            margin-top: 50px;
            font-family: var(--wtr-font-brand);
            font-size: 3.5rem;
            color: var(--wtr-color-gold);
            letter-spacing: 15px;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
        }

        /* ==========================================================================
           [04] APPLICATION SCREENS
           ========================================================================== */
        .screen-module {
            display: none;
            width: 100%;
            max-width: 440px;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .screen-module.is-active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        /* ==========================================================================
           [05] COMBAT GRID (STRICT 110px ARCHITECTURE)
           ========================================================================== */
        .arena-hud {
            background: rgba(0,0,0,0.85);
            padding: 15px 40px;
            border-radius: 60px;
            font-family: var(--wtr-font-brand);
            font-size: 1.6rem;
            margin-bottom: 40px;
            border: 1px solid var(--wtr-glass-border);
            box-shadow: var(--wtr-shadow-heavy);
            backdrop-filter: var(--wtr-glass-blur);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .combat-grid-layout {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            justify-content: center;
            align-content: center;
            gap: 0;
            margin-bottom: 35px;
            /* Prevents grid from shifting on SVG load */
            contain: layout;
        }

        .combat-cell {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 6px solid var(--wtr-grid-color);
            background: transparent;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* H-SHAPE LOGIC */
        .combat-cell[data-index="0"], .combat-cell[data-index="1"], .combat-cell[data-index="2"] { border-top: none; }
        .combat-cell[data-index="6"], .combat-cell[data-index="7"], .combat-cell[data-index="8"] { border-bottom: none; }
        .combat-cell[data-index="0"], .combat-cell[data-index="3"], .combat-cell[data-index="6"] { border-left: none; }
        .combat-cell[data-index="2"], .combat-cell[data-index="5"], .combat-cell[data-index="8"] { border-right: none; }

        .combat-cell:active {
            background: rgba(255,255,255,0.08);
        }

        /* SVG SYMBOLS */
        .combat-symbol {
            width: 75px;
            height: 75px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 15px currentColor);
            /* Prevents SVG from expanding cell size */
            pointer-events: none;
        }

        .draw-path-x { stroke-dasharray: 140; stroke-dashoffset: 140; animation: titan-draw 0.25s ease-out forwards; }
        .draw-path-o { stroke-dasharray: 220; stroke-dashoffset: 220; animation: titan-draw 0.3s ease-out forwards; }
        
        @keyframes titan-draw {
            to { stroke-dashoffset: 0; }
        }

        /* ==========================================================================
           [06] ENTERPRISE COMPONENTS (BUTTONS & INPUTS)
           ========================================================================== */
        .glass-container {
            background: var(--wtr-glass-bg);
            backdrop-filter: var(--wtr-glass-blur);
            border-radius: 40px;
            padding: 45px 35px;
            width: 92%;
            border: 1px solid var(--wtr-glass-border);
            box-shadow: var(--wtr-shadow-heavy);
            position: relative;
        }

        .titan-input {
            width: 100%;
            padding: 20px 25px;
            margin-bottom: 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-family: var(--wtr-font-main);
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s var(--wtr-font-main);
        }

        .titan-input:focus {
            border-color: var(--wtr-color-gold);
            box-shadow: var(--wtr-glow-gold);
            background: rgba(0,0,0,0.85);
        }

        .btn-titan {
            width: 100%;
            padding: 20px;
            margin-top: 15px;
            border-radius: 50px;
            border: none;
            font-family: var(--wtr-font-main);
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary-x { background: var(--wtr-color-x); color: #fff; box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4); }
        .btn-primary-o { background: var(--wtr-color-o); color: #000; box-shadow: 0 10px 30px rgba(46, 213, 115, 0.4); }
        .btn-ghost { background: transparent; border: 2px solid var(--wtr-grid-color); color: #fff; }
        
        .btn-titan:active { transform: scale(0.95); opacity: 0.9; }

        /* ==========================================================================
           [07] LOBBY & STORE NAV
           ========================================================================== */
        .nav-top-bar {
            position: absolute;
            top: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 50;
        }

        .stats-badge {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: var(--wtr-color-gold);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* WhatsApp-Style Comms */
        .comms-module {
            width: 100%;
            max-width: 400px;
            background: rgba(0,0,0,0.8);
            border-radius: 30px;
            border: 1px solid var(--wtr-glass-border);
            margin-top: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--wtr-shadow-heavy);
        }

        .comms-readout {
            height: 120px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.9rem;
        }

        .bubble {
            background: rgba(255,255,255,0.08);
            padding: 10px 18px;
            border-radius: 20px;
            width: fit-content;
            max-width: 85%;
            border-bottom-left-radius: 4px;
        }

        .bubble.self {
            align-self: flex-end;
            background: rgba(46, 213, 115, 0.15);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 4px;
        }

        .bubble strong { color: var(--wtr-color-gold); margin-right: 6px; }

        .comms-input-row {
            display: flex;
            border-top: 1px solid var(--wtr-glass-border);
            background: rgba(255,255,255,0.03);
        }

        .comms-field {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 18px;
            font-family: var(--wtr-font-main);
        }

        .comms-send {
            background: var(--wtr-color-o);
            border: none;
            padding: 0 30px;
            font-weight: 900;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
