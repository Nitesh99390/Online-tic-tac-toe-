<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="quantum-dark">
<head>
    <meta charset="UTF-8" />
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    <meta 
        name="theme-color" 
        content="#05070a" 
    />
    <title>Nitesh Titan | Quantum Engine Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
        href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" 
        rel="stylesheet" 
    />

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* ==========================================================================
           [01] ADVANCED CSS DESIGN TOKENS (EXPANDED)
           ========================================================================== */
        :root {
            /* Core Backgrounds */
            --bg-base: #05070a;
            --glass-bg: rgba(10, 15, 20, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(25px);
            
            /* Typography */
            --font-brand: 'Permanent Marker', cursive;
            --font-main: 'Poppins', sans-serif;
            --font-code: 'JetBrains Mono', monospace;

            /* Branding Colors */
            --color-gold: #fbbf24;
            --color-danger: #ff4757;
            --glow-gold: 0 0 30px rgba(251, 191, 36, 0.3);
            --shadow-heavy: 0 30px 60px rgba(0, 0, 0, 0.9);
            
            /* DYNAMIC SKIN SYSTEM (Equipped via Store) */
            --active-grid: #5f6a6d; 
            --active-x: #ff4757;    
            --active-o: #2ed573;    
            --active-glow-x: 0 0 20px rgba(255, 71, 87, 0.4);
            --active-glow-o: 0 0 20px rgba(46, 213, 115, 0.4);
        }

        /* ==========================================================================
           [02] GLOBAL ARCHITECTURE
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: var(--bg-base);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: var(--font-main);
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #dynamic-bg-layer {
            position: absolute;
            inset: 0;
            z-index: -10;
            background-size: cover;
            background-position: center;
            filter: brightness(0.4);
            transition: background-image 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            z-index: -9;
            background: radial-gradient(circle at center, transparent 10%, rgba(0,0,0,0.95) 100%);
        }

        /* ==========================================================================
           [03] SCREEN NAVIGATION SYSTEM
           ========================================================================== */
        .app-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .app-screen.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            z-index: 20;
        }

        /* ==========================================================================
           [04] PREMIUM GLASS COMPONENTS
           ========================================================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            box-shadow: var(--shadow-heavy);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        /* ==========================================================================
           [05] TITAN UI CONTROLS (BUTTONS & INPUTS)
           ========================================================================== */
        .premium-input {
            width: 100%;
            padding: 20px 25px;
            margin-bottom: 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-family: var(--font-main);
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .premium-input:focus {
            border-color: var(--color-gold);
            box-shadow: var(--glow-gold);
            background: rgba(0,0,0,0.8);
        }

        .btn {
            width: 100%;
            padding: 20px;
            margin-top: 15px;
            border-radius: 50px;
            border: none;
            font-family: var(--font-main);
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn:active { transform: scale(0.95); }
        .btn-gold { background: var(--color-gold); color: #000; box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3); }
        .btn-x { background: var(--active-x); color: #fff; box-shadow: var(--active-glow-x); }
        .btn-outline { background: transparent; border: 2px solid var(--glass-border); color: #fff; }

        .point-badge {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: var(--color-gold);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--glow-gold);
        }

        /* ==========================================================================
           [06] COMBAT GRID (STRICT 110px ARCHITECTURE)
           ========================================================================== */
        .quantum-grid {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 0;
            margin-bottom: 30px;
        }

        .cell {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 6px solid var(--active-grid);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        /* H-SHAPE LOGIC (Solid Lines) */
        .cell[data-index="0"], .cell[data-index="1"], .cell[data-index="2"] { border-top: none; }
        .cell[data-index="6"], .cell[data-index="7"], .cell[data-index="8"] { border-bottom: none; }
        .cell[data-index="0"], .cell[data-index="3"], .cell[data-index="6"] { border-left: none; }
        .cell[data-index="2"], .cell[data-index="5"], .cell[data-index="8"] { border-right: none; }

        .cell svg {
            width: 75px;
            height: 75px;
            position: absolute;
            filter: drop-shadow(0 0 15px currentColor);
        }

        .draw-x { stroke-dasharray: 140; stroke-dashoffset: 140; animation: draw 0.25s ease-out forwards; stroke: var(--active-x); }
        .draw-o { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 0.3s ease-out forwards; stroke: var(--active-o); }
        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* ==========================================================================
           [07] MODALS & STORE UI
           ========================================================================== */
        dialog { margin: auto; background: transparent; border: none; padding: 0; max-width: 90vw; width: 420px; }
        dialog::backdrop { background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); }
        
        .store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-height: 60vh; overflow-y: auto; padding-right: 10px; }
        .store-item { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 25px; padding: 20px; text-align: center; }
        .store-item.equipped { border-color: var(--active-o); background: rgba(46, 213, 115, 0.1); }
        .item-preview { height: 70px; margin-bottom: 15px; border-radius: 15px; background: #000; display: flex; align-items: center; justify-content: center; }
        
        .toast-box {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: var(--color-gold); color: #000; padding: 15px 30px; border-radius: 50px;
            font-weight: 900; font-size: 0.9rem; z-index: 9999; box-shadow: var(--shadow-heavy);
            animation: slideUp 0.3s forwards;
        }
        @keyframes slideUp { from { transform: translate(-50%, 50px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="dynamic-bg-layer"></div>
    <div class="bg-overlay"></div>

    <div id="screen-splash" class="app-screen active">
        <h1 class="font-brand text-gold" style="font-size: 4.5rem; line-height: 1;">WTR LAB 🚀</h1>
        <p style="margin-top: 20px; font-weight: 900; letter-spacing: 5px; color: var(--text-muted);">QUANTUM ENGINE BOOTING...</p>
    </div>

    <div id="screen-auth" class="app-screen">
        <div class="glass-panel">
            <h1 class="font-brand" style="font-size: 3.5rem; margin-bottom: 10px;">TITAN 🔐</h1>
            <p class="text-gold" style="font-weight: 900; letter-spacing: 3px; margin-bottom: 35px;">PREMIUM ACCESS</p>
            <input type="email" id="inp-email" class="premium-input" placeholder="AGENT EMAIL">
            <input type="password" id="inp-pass" class="premium-input" placeholder="SECURITY KEY">
            <button class="btn btn-x" id="btn-login">ESTABLISH LINK</button>
        </div>
    </div>
    <div id="screen-lobby" class="app-screen">
        <nav style="position: absolute; top: 0; width: 100%; padding: 30px; display: flex; justify-content: space-between; align-items: center;">
            <div class="point-badge">
                🪙 <span id="ui-nav-points">0</span>
            </div>
            <div style="display: flex; gap: 20px;">
                <button class="btn-outline" style="width: 50px; height: 50px; border-radius: 50%; padding: 0;" onclick="openStore()">
                    🛒
                </button>
                <button class="btn-outline" style="width: 50px; height: 50px; border-radius: 50%; padding: 0;" onclick="document.getElementById('modal-settings').showModal()">
                    ⚙️
                </button>
            </div>
        </nav>

        <div class="glass-panel">
            <div style="width: 100px; height: 100px; background: rgba(0,0,0,0.8); border: 2px solid var(--color-gold); border-radius: 50%; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; box-shadow: var(--glow-gold);">
                👤
            </div>
            <p style="font-size: 0.8rem; font-weight: 800; color: var(--text-muted); letter-spacing: 2px;">ACTIVE AGENT</p>
            <h2 id="ui-agent-name" style="font-size: 2.2rem; font-weight: 900; margin-bottom: 30px;">AWAITING...</h2>

            <div style="background: rgba(0,0,0,0.5); border: 1px dashed var(--color-gold); border-radius: 20px; padding: 20px; margin-bottom: 30px;">
                <p style="font-size: 0.7rem; color: var(--text-muted); font-weight: 800;">COMBAT FREQUENCY ID 📡</p>
                <h3 id="ui-agent-code" class="font-marker" style="font-size: 3rem; color: var(--color-gold); letter-spacing: 8px; margin-top: 10px;">----</h3>
            </div>

            <input type="text" id="inp-target" class="premium-input" placeholder="ENTER TARGET ID" maxlength="6">
            <button class="btn btn-x" id="btn-challenge">ENGAGE TARGET ⚔️</button>
            <button class="btn btn-outline" id="btn-offline" style="margin-top: 15px;">LOCAL SIMULATION</button>
        </div>
    </div>

    <div id="screen-store" class="app-screen" style="background: rgba(0,0,0,0.95); backdrop-filter: blur(30px);">
        <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 30px; border-bottom: 1px solid var(--glass-border); position: absolute; top: 0;">
            <h2 class="font-marker" style="font-size: 2rem; color: var(--color-gold);">ARMORY 🛒</h2>
            <div class="point-badge">🪙 <span id="ui-store-points">0</span></div>
            <button class="btn-outline" style="width: 50px; height: 50px; border-radius: 50%;" onclick="switchScreen('screen-lobby')">✖</button>
        </header>
        
        <div style="width: 100%; max-width: 500px; padding: 0 20px; margin-top: 100px;">
            <div style="display: flex; gap: 15px; margin-bottom: 30px;">
                <button class="store-tab active" id="tab-skins" onclick="renderStore('skins')" style="flex:1; padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: #fff; font-weight: 800; cursor: pointer;">SKINS 🎨</button>
                <button class="store-tab" id="tab-bgs" onclick="renderStore('bgs')" style="flex:1; padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: #fff; font-weight: 800; cursor: pointer;">MAPS 🌌</button>
            </div>
            <div class="store-grid" id="ui-store-grid"></div>
        </div>
    </div>

    <div id="screen-arena" class="app-screen">
        <div class="glass-panel" style="padding: 15px; width: 90%; max-width: 450px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; border-radius: 20px;">
            <div style="text-align: left;">
                <span style="font-size: 0.7rem; color: var(--text-muted); font-weight: 800;">YOU</span><br>
                <b id="ui-p1-name" style="color: var(--active-x); font-size: 1.2rem;">AGENT</b>
            </div>
            <div class="font-marker text-gold" style="font-size: 2rem;">VS</div>
            <div style="text-align: right;">
                <span style="font-size: 0.7rem; color: var(--text-muted); font-weight: 800;">ENEMY</span><br>
                <b id="ui-p2-name" style="color: var(--active-o); font-size: 1.2rem;">TARGET</b>
            </div>
        </div>

        <h2 id="ui-turn-text" class="font-marker" style="font-size: 1.8rem; margin-bottom: 40px; letter-spacing: 2px;">STANDBY...</h2>

        <div class="quantum-grid" id="ui-combat-grid">
            <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
        </div>

        <button class="btn btn-outline" style="width: 80%; max-width: 350px; border-color: var(--color-danger); color: var(--color-danger);" onclick="abortMission()">ABORT MISSION</button>
    </div>

    <dialog id="modal-result">
        <div class="glass-panel" style="width: 100%;">
            <h1 id="ui-result-title" class="font-marker" style="font-size: 4rem; line-height: 1; margin-bottom: 10px;">WIN</h1>
            <p id="ui-result-reward" style="color: var(--color-gold); font-weight: 900; letter-spacing: 2px; margin-bottom: 30px;">+50 CREDITS 🪙</p>
            <button class="btn btn-gold" id="btn-rematch">RE-ENGAGE</button>
            <button class="btn btn-outline" style="margin-top: 15px;" onclick="abortMission()">RETURN TO BASE</button>
        </div>
    </dialog>

    <dialog id="modal-settings">
        <div class="glass-panel" style="width: 100%;">
            <h2 class="font-marker" style="font-size: 2rem; margin-bottom: 30px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">SETTINGS ⚙️</h2>
            
            <div style="background: rgba(255, 71, 87, 0.1); border: 1px dashed var(--color-danger); border-radius: 20px; padding: 20px; margin-bottom: 30px;">
                <p style="font-size: 0.8rem; color: var(--color-danger); font-weight: 900; margin-bottom: 15px;">SYSTEM OVERRIDE</p>
                <input type="text" id="inp-cheat" class="premium-input" placeholder="ACCESS CODE" style="margin-bottom: 15px; font-family: var(--font-code);">
                <button class="btn btn-x" onclick="executeCheat()">EXECUTE COMMAND</button>
            </div>

            <button class="btn btn-outline" onclick="firebase.auth().signOut().then(()=>location.reload())">DISCONNECT AGENT</button>
            <button class="btn btn-outline" style="margin-top: 15px; border-color: #555;" onclick="document.getElementById('modal-settings').close()">CLOSE</button>
        </div>
    </dialog>

    <div id="toast-container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBldLyB9d18ZGStroUC0-yjuUrp31DFQ28",
            authDomain: "online-tic-tac-toe-d919f.firebaseapp.com",
            projectId: "online-tic-tac-toe-d919f",
            storageBucket: "online-tic-tac-toe-d919f.firebasestorage.app",
            messagingSenderId: "644365665798",
            appId: "1:644365665798:web:f90b64bdc3aa6912032587"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        window.State = {
            user: null, profile: null, mode: 'online', gameId: null,
            board: Array(9).fill(''), mySym: 'X', turn: 'X', active: false,
            points: 0, 
            inventory: { skins: ['default'], bgs: ['default'] },
            equipped: { skin: 'default', bg: 'default' }
        };

        const StoreDB = {
            skins: [
                { id: 'default', name: 'NEON CLASSIC', price: 0, colorX: '#ff4757', colorO: '#2ed573' },
                { id: 'gold', name: 'TITAN GOLD', price: 500, colorX: '#fbbf24', colorO: '#f59e0b' },
                { id: 'matrix', name: 'MATRIX CODE', price: 1200, colorX: '#00ff00', colorO: '#008f11' },
                { id: 'ice', name: 'QUANTUM ICE', price: 3000, colorX: '#00d2d3', colorO: '#54a0ff' }
            ],
            bgs: [
                { id: 'default', name: 'DARK CITY', price: 0, url: 'https://source.unsplash.com/featured/?cyberpunk,dark' },
                { id: 'space', name: 'DEEP SPACE', price: 1000, url: 'https://source.unsplash.com/featured/?galaxy,stars' },
                { id: 'grid', name: 'NEON GRID', price: 2500, url: 'https://source.unsplash.com/featured/?synthwave,neon' }
            ]
        };

        // UI Core Helpers
        const switchScreen = (id) => {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        const showToast = (msg) => {
            const t = document.createElement('div');
            t.className = 'toast-box'; t.innerText = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => { t.style.animation = 'slideUp 0.3s reverse forwards'; setTimeout(() => t.remove(), 300); }, 3000);
        };
        /* ==========================================================================
           [08] TITAN ARMORY & COSMETICS LOGIC (EXPANDED)
           ========================================================================== */
        
        // Items ko Store Screen par render karne ka engine
        window.renderStore = (category) => {
            const grid = document.getElementById('ui-store-grid');
            grid.innerHTML = ''; // Pehle grid ko empty karein
            
            // UI Tabs highlight update
            document.querySelectorAll('.store-tab').forEach(t => t.style.background = 'rgba(255,255,255,0.05)');
            document.getElementById(`tab-${category}`).style.background = 'var(--color-gold)';
            document.getElementById(`tab-${category}`).style.color = '#000';

            const items = StoreDB[category];
            const inventory = State.profile.inventory?.[category] || ['default'];
            const equippedId = State.equipped[category === 'skins' ? 'skin' : 'bg'];

            items.forEach(item => {
                const isOwned = inventory.includes(item.id);
                const isEquipped = equippedId === item.id;
                
                let btnHTML = '';
                if (isEquipped) {
                    btnHTML = `<button class="btn" style="background:rgba(46, 213, 115, 0.2); color:var(--active-o); border:1px solid var(--active-o); font-size:0.8rem; height:45px;" disabled>EQUIPPED</button>`;
                } else if (isOwned) {
                    btnHTML = `<button class="btn btn-outline" style="font-size:0.8rem; height:45px;" onclick="equipItem('${category}', '${item.id}')">EQUIP GEAR</button>`;
                } else {
                    btnHTML = `<button class="btn btn-gold" style="font-size:0.8rem; height:45px;" onclick="buyItem('${category}', '${item.id}', ${item.price})">BUY 🪙 ${item.price}</button>`;
                }

                const previewStyle = category === 'skins' 
                    ? `box-shadow: 0 0 15px ${item.colorX}44; border:1px solid ${item.colorX}22;` 
                    : `background-image: url('${item.url}'); background-size: cover;`;

                grid.innerHTML += `
                    <div class="store-item ${isEquipped ? 'equipped' : ''}">
                        <div class="item-preview" style="${previewStyle}">
                            ${category === 'skins' ? `
                                <span style="color: ${item.colorX}; font-weight: 900; font-size:1.5rem; font-family:var(--font-brand);">X</span> 
                                <span style="color: ${item.colorO}; font-weight: 900; font-size:1.5rem; font-family:var(--font-brand); margin-left:10px;">O</span>
                            ` : ''}
                        </div>
                        <div class="item-name">${item.name}</div>
                        ${btnHTML}
                    </div>
                `;
            });
        };

        window.openStore = () => {
            updatePointsUI();
            switchScreen('screen-store');
            renderStore('skins');
        };

        window.buyItem = async (category, itemId, price) => {
            if (State.points < price) {
                showToast("INSUFFICIENT QUANTUM CREDITS!");
                return;
            }
            
            State.points -= price;
            State.profile.inventory[category].push(itemId);
            
            await syncProfileToCloud();
            showToast("GEAR SECURED IN ARMORY!");
            renderStore(category);
            updatePointsUI();
        };

        window.equipItem = async (category, itemId) => {
            const key = category === 'skins' ? 'skin' : 'bg';
            State.equipped[key] = itemId;
            
            await syncProfileToCloud();
            showToast("SYSTEM HARDWARE UPDATED!");
            applyVisualSkins();
            renderStore(category);
        };

        const applyVisualSkins = () => {
            const skin = StoreDB.skins.find(s => s.id === State.equipped.skin) || StoreDB.skins[0];
            const bg = StoreDB.bgs.find(b => b.id === State.equipped.bg) || StoreDB.bgs[0];
            
            // Dynamic CSS Variable Injection
            document.documentElement.style.setProperty('--active-x', skin.colorX);
            document.documentElement.style.setProperty('--active-o', skin.colorO);
            document.documentElement.style.setProperty('--active-glow-x', `0 0 20px ${skin.colorX}66`);
            document.documentElement.style.setProperty('--active-glow-o', `0 0 20px ${skin.colorO}66`);
            
            document.getElementById('dynamic-bg-layer').style.backgroundImage = `url('${bg.url}')`;
        };

        /* ==========================================================================
           [09] CHEAT CODE & DATA SYNC (nk@99390)
           ========================================================================== */
        window.executeCheat = async () => {
            const inp = document.getElementById('inp-cheat');
            const code = inp.value.trim();
            
            if (code === 'nk@99390') {
                State.points += 1000000;
                await syncProfileToCloud();
                
                showToast("🔥 TITAN OVERRIDE: 1,000,000 CREDITS ADDED 🔥");
                
                // Massive Gold/Red Confetti Blast
                canvasConfetti({ 
                    particleCount: 500, spread: 160, origin: { y: 0.5 }, 
                    colors: ['#fbbf24', '#ff4757', '#ffffff'] 
                });
                
                inp.value = '';
                document.getElementById('modal-settings').close();
                updatePointsUI();
            } else {
                showToast("ACCESS DENIED: INVALID KEY");
            }
        };

        const updatePointsUI = () => {
            const pStr = State.points.toLocaleString();
            document.getElementById('ui-nav-points').innerText = pStr;
            document.getElementById('ui-store-points').innerText = pStr;
        };

        const syncProfileToCloud = async () => {
            if (!State.user) return;
            try {
                await db.collection('users').doc(State.user.uid).update({
                    points: State.points,
                    inventory: State.profile.inventory,
                    equipped: State.equipped
                });
            } catch (e) { console.error("Sync Failure", e); }
        };

        /* ==========================================================================
           [10] ZERO-LATENCY COMBAT ENGINE (pointerdown)
           ========================================================================== */
        const SYMBOL_X_SVG = `<svg viewBox="0 0 100 100"><path class="draw-x" d="M 20 20 L 80 80 M 80 20 L 20 80" stroke-width="12" stroke-linecap="round" fill="none"/></svg>`;
        const SYMBOL_O_SVG = `<svg viewBox="0 0 100 100"><circle class="draw-o" cx="50" cy="50" r="35" stroke-width="12" fill="none" stroke-linecap="round"/></svg>`;

        const initCombatSystem = () => {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, idx) => {
                // pointerdown bypasses the 300ms touch delay for instant 0ms feedback
                cell.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    if (State.active) handleCellTrigger(idx);
                });
            });
        };

        const handleCellTrigger = async (idx) => {
            if (State.board[idx] !== '' || !State.active) return;
            if (State.mode === 'online' && State.turn !== State.mySym) {
                showToast("WAIT FOR TARGET");
                return;
            }

            // OPTIMISTIC UI: Update screen instantly (0ms)
            State.board[idx] = State.mySym;
            renderBoard();
            if (navigator.vibrate) navigator.vibrate(35);

            const result = calculateWin(State.board);
            const nextT = State.mySym === 'X' ? 'O' : 'X';

            if (State.mode === 'offline') {
                if (result === 'win') endCombat(State.mySym);
                else if (result === 'draw') endCombat('draw');
                else { State.turn = nextT; updateHUD(); }
            } else {
                // Firebase Sync
                const gRef = db.collection('games').doc(State.gameId);
                try {
                    if (result === 'win') await gRef.update({ b: State.board.join(''), s: 'win', w: State.mySym });
                    else if (result === 'draw') await gRef.update({ b: State.board.join(''), s: 'draw' });
                    else await gRef.update({ b: State.board.join(''), t: nextT });
                } catch (e) { console.error(e); }
            }
        };

        const renderBoard = () => {
            document.querySelectorAll('.cell').forEach((c, i) => {
                const val = State.board[i];
                if (val === 'X' && !c.innerHTML.includes('draw-x')) c.innerHTML = SYMBOL_X_SVG;
                else if (val === 'O' && !c.innerHTML.includes('draw-o')) c.innerHTML = SYMBOL_O_SVG;
                else if (!val) c.innerHTML = '';
            });
        };

        const calculateWin = (b) => {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let p of lines) if (b[p[0]] && b[p[0]] === b[p[1]] && b[p[0]] === b[p[2]]) return 'win';
            return b.includes('') ? 'continue' : 'draw';
        };

        const endCombat = async (winner) => {
            State.active = false;
            let earned = 0;
            const title = document.getElementById('ui-result-title');
            const reward = document.getElementById('ui-result-reward');

            if (winner === 'draw') {
                title.innerText = "DRAW"; title.style.color = "#fff";
                reward.innerText = "+10 QUANTUM CREDITS"; earned = 10;
            } else {
                const isMe = (State.mode === 'online' && winner === State.mySym) || State.mode === 'offline';
                if (isMe) {
                    title.innerText = "VICTORY"; title.style.color = "var(--active-o)";
                    reward.innerText = "+50 QUANTUM CREDITS"; earned = 50;
                    canvasConfetti({ particleCount: 200, spread: 120, origin: { y: 0.6 } });
                } else {
                    title.innerText = "DEFEAT"; title.style.color = "var(--active-x)";
                    reward.innerText = "+5 CREDITS"; earned = 5;
                }
            }

            if (State.mode === 'online') {
                State.points += earned;
                await syncProfileToCloud();
                updatePointsUI();
            }

            setTimeout(() => document.getElementById('modal-result').style.display = 'flex', 800);
        };

        const updateHUD = () => {
            const isMyTurn = State.turn === State.mySym;
            const hud = document.getElementById('ui-turn-text');
            hud.innerText = isMyTurn ? "YOUR TURN" : "TARGET MOVING...";
            hud.style.color = isMyTurn ? "var(--active-o)" : "var(--text-muted)";
        };

        /* ==========================================================================
           [11] MULTIPLAYER HANDSHAKE & AUTH (BUG-FREE COMPAT)
           ========================================================================== */
        let unsubGame = null;

        const establishSync = (gameId, mySym, enemy) => {
            State.gameId = gameId; State.mySym = mySym; State.mode = 'online'; State.active = true;
            document.getElementById('ui-p1-name').innerText = State.profile.name;
            document.getElementById('ui-p2-name').innerText = enemy;
            switchScreen('screen-arena');

            if (unsubGame) unsubGame();
            unsubGame = db.collection('games').doc(gameId).onSnapshot((snap) => {
                if (!snap.exists) { showToast("LINK SEVERED"); return abortMission(); }
                const data = snap.data();
                State.board = data.b ? data.b.split('') : Array(9).fill('');
                State.turn = data.t || 'X';
                State.active = (data.s === 'playing');
                renderBoard();
                if (data.s === 'win') endCombat(data.w);
                else if (data.s === 'draw') endCombat('draw');
                else updateHUD();
            });
        };

        document.getElementById('btn-challenge').onclick = async () => {
            const targetCode = document.getElementById('inp-target').value.toUpperCase().trim();
            if (!targetCode || targetCode === State.profile.code) return showToast("INVALID TARGET");
            
            document.getElementById('btn-challenge').innerText = 'SCANNING...';
            const snap = await db.collection('users').where('code', '==', targetCode).get();
            if (snap.empty) { document.getElementById('btn-challenge').innerText = 'ENGAGE TARGET ⚔️'; return showToast("TARGET OFFLINE"); }
            
            const targetData = snap.docs[0].data();
            const invRef = await db.collection('invites').add({ sUid: State.user.uid, sName: State.profile.name, rUid: targetData.uid, status: 'pending' });
            
            document.getElementById('btn-challenge').innerText = 'TRANSMITTING...';
            const uInv = db.collection('invites').doc(invRef.id).onSnapshot((dSnap) => {
                const d = dSnap.data();
                if (d?.status === 'accepted') { establishSync(d.gId, 'X', targetData.name); db.collection('invites').doc(invRef.id).delete(); uInv(); }
                else if (d?.status === 'rejected') { showToast("TARGET EVADED"); db.collection('invites').doc(invRef.id).delete(); uInv(); document.getElementById('btn-challenge').innerText = 'ENGAGE TARGET ⚔️'; }
            });
        };

        const listenInvites = () => {
            db.collection('invites').where('rUid', '==', State.user.uid).where('status', '==', 'pending').onSnapshot((snap) => {
                snap.docChanges().forEach(c => {
                    if (change.type === 'added') {
                        const inv = c.doc.data();
                        document.getElementById('ui-challenger-id').innerText = inv.sName;
                        document.getElementById('modal-challenge').showModal();
                        document.getElementById('btn-accept-sync').onclick = async () => {
                            const gRef = await db.collection('games').add({ b: '         ', t: 'X', s: 'playing' });
                            await db.collection('invites').doc(c.doc.id).update({ status: 'accepted', gId: gRef.id });
                            document.getElementById('modal-challenge').close(); establishSync(gRef.id, 'O', inv.sName);
                        };
                    }
                });
            });
        };

        window.abortMission = () => { location.reload(); };

        document.getElementById('btn-offline').onclick = () => {
            State.mode = 'offline'; State.active = true; State.board = Array(9).fill(''); State.turn = 'X'; State.mySym = 'X';
            document.getElementById('ui-p1-name').innerText = "PLAYER X"; document.getElementById('ui-p2-name').innerText = "PLAYER O";
            switchScreen('screen-arena'); renderBoard(); updateHUD();
        };

        document.getElementById('btn-rematch').onclick = async () => {
            document.getElementById('modal-result').style.display = 'none';
            if (State.mode === 'online') await db.collection('games').doc(State.gameId).update({ b: '         ', t: 'X', s: 'playing' });
            else document.getElementById('btn-offline').click();
        };
                /**
         * ========================================================================
         * [ENGINE 6] TITAN ARMORY MASTER DATABASE (EXPANDED)
         * Isme hum saari premium skins aur environments define kar rahe hain.
         * ========================================================================
         */
        const StoreDB = {
            // Quantum Skins: X aur O ka color aur unka glow effect define karta hai
            skins: [
                { 
                    id: 'default', 
                    name: 'NEON CLASSIC', 
                    price: 0, 
                    colorX: '#ff4757', 
                    colorO: '#2ed573' 
                },
                { 
                    id: 'gold_titan', 
                    name: 'CYBER GOLD', 
                    price: 5000, 
                    colorX: '#fbbf24', 
                    colorO: '#f59e0b' 
                },
                { 
                    id: 'matrix_hacker', 
                    name: 'MATRIX CODE', 
                    price: 12000, 
                    colorX: '#00ff00', 
                    colorO: '#008f11' 
                },
                { 
                    id: 'blood_moon', 
                    name: 'BLOOD MOON', 
                    price: 25000, 
                    colorX: '#ff0000', 
                    colorO: '#7f0000' 
                },
                { 
                    id: 'quantum_ice', 
                    name: 'FROZEN NITRO', 
                    price: 50000, 
                    colorX: '#00d2d3', 
                    colorO: '#54a0ff' 
                }
            ],
            // Environments: Background images jo Unsplash API se fetch hoti hain
            bgs: [
                { 
                    id: 'default', 
                    name: 'NIGHT CITY', 
                    price: 0, 
                    url: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2070' 
                },
                { 
                    id: 'deep_space', 
                    name: 'ORION GALAXY', 
                    price: 2500, 
                    url: 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2111' 
                },
                { 
                    id: 'synth_grid', 
                    name: 'RETRO WAVE', 
                    price: 8000, 
                    url: 'https://images.unsplash.com/photo-1614850523296-e8c041de4398?q=80&w=2070' 
                },
                { 
                    id: 'binary_void', 
                    name: 'THE MATRIX', 
                    price: 15000, 
                    url: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070' 
                }
            ]
        };

        /**
         * ========================================================================
         * [ENGINE 7] DYNAMIC STYLE INJECTOR
         * Yeh function bina page reload kiye skin aur background apply karta hai.
         * ========================================================================
         */
        window.applyCosmetics = () => {
            // Current equipped IDs uthao state se
            const currentSkinId = State.profile?.equipped?.skin || 'default';
            const currentBgId = State.profile?.equipped?.bg || 'default';

            // Database se match find karo
            const skinData = StoreDB.skins.find(s => s.id === currentSkinId) || StoreDB.skins[0];
            const bgData = StoreDB.bgs.find(b => b.id === currentBgId) || StoreDB.bgs[0];

            // 1. CSS Root Variables Inject karo (The Magic)
            const root = document.documentElement;
            root.style.setProperty('--wtr-color-x', skinData.colorX);
            root.style.setProperty('--wtr-color-o', skinData.colorO);
            
            // 2. Dynamic Background image change karo fading effect ke sath
            document.body.style.backgroundImage = `url('${bgData.url}')`;
            
            console.log(`>> COSMETICS APPLIED: Skin[${skinData.name}] BG[${bgData.name}]`);
        };

        /**
         * ========================================================================
         * [ENGINE 8] DATA PERSISTENCE LAYER (SYNC)
         * Points aur Inventory ko Firebase par save karne ke liye.
         * ========================================================================
         */
        window.syncProfileData = async () => {
            if (!State.user) return;
            
            try {
                const userRef = db.collection('users').doc(State.user.uid);
                await userRef.update({
                    points: State.points,
                    inventory: State.profile.inventory,
                    equipped: State.profile.equipped,
                    lastActive: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error(">> SYNC FAILED:", error);
                // Fallback: LocalStorage mein save karo agar net slow hai
                localStorage.setItem('titan_backup_points', State.points);
            }
        };

        /**
         * ========================================================================
         * PROJECT STATUS: FULLY ASSEMBLED [100%]
         * Sabhi systems active hain. Game loop shuru hai.
         * ========================================================================
         */
        console.log(">> NITESH TITAN QUANTUM ENGINE: ALL SYSTEMS NOMINAL.");


        /* ==========================================================================
           [12] FINAL SYSTEM BOOT
           ========================================================================== */
        initCombatSystem();

        auth.onAuthStateChanged(async (user) => {
            setTimeout(async () => {
                if (user) {
                    State.user = user;
                    const pSnap = await db.collection('users').doc(user.uid).get();
                    if (pSnap.exists) {
                        const d = pSnap.data();
                        State.profile = d;
                        State.points = d.points || 0;
                        State.inventory = d.inventory || { skins: ['default'], bgs: ['default'] };
                        State.equipped = d.equipped || { skin: 'default', bg: 'default' };
                    } else {
                        State.profile = { uid: user.uid, name: user.email.split('@')[0].toUpperCase(), code: Math.random().toString(36).substring(2,6).toUpperCase(), inventory: { skins: ['default'], bgs: ['default'] } };
                        await db.collection('users').doc(user.uid).set({ ...State.profile, points: 0, equipped: State.equipped });
                    }
                    document.getElementById('ui-agent-name').innerText = State.profile.name;
                    document.getElementById('ui-agent-code').innerText = State.profile.code;
                    updatePointsUI(); applyVisualSkins(); switchScreen('screen-lobby'); listenInvites();
                } else { switchScreen('screen-auth'); }
                document.getElementById('splash-sequence').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-sequence').style.display = 'none', 1000);
            }, 2500);
        });

        document.getElementById('btn-login').onclick = async () => {
            const e = document.getElementById('inp-email').value, p = document.getElementById('inp-pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } 
            catch { try { await auth.createUserWithEmailAndPassword(e, p); } catch(err) { showToast(err.message.toUpperCase()); } }
        };

    </script>
