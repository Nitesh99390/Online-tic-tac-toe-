<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Tic-Tac-Toe</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; margin-top: 20px; }
        .cell { width: 100px; height: 100px; background: #fff; border: 2px solid #333; display: flex; 
                align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; font-weight: bold; }
        .cell:hover { background: #e9ecef; }
        #status { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: #d9534f; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Online Tic-Tac-Toe</h2>
    <div id="status">Waiting for game to start...</div>
    
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button onclick="resetGame()">Reset Game</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Aapka Config
        const firebaseConfig = {
            apiKey: "AIzaSyBldLyB9d18ZGStroUC0-yjuUrp31DFQ28",
            authDomain: "online-tic-tac-toe-d919f.firebaseapp.com",
            databaseURL: "https://online-tic-tac-toe-d919f-default-rtdb.firebaseio.com",
            projectId: "online-tic-tac-toe-d919f",
            storageBucket: "online-tic-tac-toe-d919f.firebasestorage.app",
            messagingSenderId: "644365665798",
            appId: "1:644365665798:web:f90b64bdc3aa6912032587",
            measurementId: "G-67C5NCQ6D4"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameRef = ref(db, 'game');

        let currentPlayer = "X"; 
        let boardState = ["", "", "", "", "", "", "", "", ""];

        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');

        // 1. Listen for updates from Firebase
        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                boardState = data.board;
                currentPlayer = data.turn;
                updateUI();
                checkWinner(data.board);
            } else {
                // Initialize game in DB if empty
                resetGame();
            }
        });

        // 2. Cell Click Function
        cells.forEach(cell => {
            cell.addEventListener('click', (e) => {
                const index = e.target.getAttribute('data-index');

                if (boardState[index] === "" ) {
                    boardState[index] = currentPlayer;
                    const nextTurn = currentPlayer === "X" ? "O" : "X";
                    
                    // Sync to Firebase
                    update(gameRef, {
                        board: boardState,
                        turn: nextTurn
                    });
                }
            });
        });

        // 3. UI Update
        function updateUI() {
            cells.forEach((cell, index) => {
                cell.innerText = boardState[index];
            });
            statusDisplay.innerText = `Turn: Player ${currentPlayer}`;
        }

        // 4. Reset Game
        window.resetGame = function() {
            set(gameRef, {
                board: ["", "", "", "", "", "", "", "", ""],
                turn: "X"
            });
        };

        // 5. Basic Winner Logic
        function checkWinner(board) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let p of winPatterns) {
                if (board[p[0]] && board[p[0]] === board[p[1]] && board[p[0]] === board[p[2]]) {
                    statusDisplay.innerText = `Player ${board[p[0]]} Wins! 🎉`;
                    return;
                }
            }
            if (!board.includes("")) statusDisplay.innerText = "It's a Draw! 🤝";
        }

    </script>
</body>
</html>
