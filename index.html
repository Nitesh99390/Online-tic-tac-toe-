<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe Pro - Clean Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* ================= CLEAN & SOLID UI ================= */
        :root {
            --bg-main: #0f172a;        /* Solid Dark Blue/Gray */
            --bg-card: #1e293b;        /* Lighter Solid Box */
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;        /* Bright Blue */
            --primary-hover: #2563eb;
            --danger: #ef4444;         /* Red for Leave/X */
            --success: #10b981;        /* Green for O/Start */
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        .screen { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; padding: 20px; }
        .active { display: flex; }

        /* Clean Card Design - No Glassmorphism */
        .container {
            background-color: var(--bg-card); padding: 30px 25px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid var(--border);
            text-align: center; width: 100%; max-width: 450px;
            max-height: 95vh; overflow-y: auto; position: relative;
        }
        
        .container::-webkit-scrollbar { width: 6px; }
        .container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* Typography Hierarchy */
        h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 5px; color: #ffffff; letter-spacing: -1px; }
        h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 20px; color: #ffffff; }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 25px; font-weight: 400; }
        .label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; text-align: left; }

        /* Inputs & Invite Code */
        input {
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; 
            border: 1px solid var(--border); background: var(--bg-input); 
            color: white; outline: none; font-size: 1rem; text-align: center;
        }
        input:focus { border-color: var(--primary); }
        
        .invite-box {
            background: var(--bg-input); border: 2px dashed var(--border);
            padding: 15px; border-radius: 12px; margin-bottom: 20px;
        }
        .invite-code-text { font-size: 1.8rem; font-weight: 900; color: var(--success); letter-spacing: 3px; }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn {
            flex: 1; background-color: var(--bg-input); color: var(--text-muted); 
            border: 1px solid var(--border); padding: 10px; border-radius: 8px; 
            font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background-color: #1e293b; color: white; }
        .btn.active { background-color: var(--primary); color: white; border-color: var(--primary); }

        .btn-main {
            background-color: var(--success); border: none; width: 100%; padding: 16px; font-size: 1.1rem;
            border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; color: white; margin-top: 10px;
        }
        .btn-main:hover { background-color: #059669; }
        .btn-danger { background-color: var(--bg-input); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: white; }

        /* Grid Setup */
        .slider-container { display: flex; align-items: center; gap: 15px; margin-bottom: 20px;}
        input[type=range] { flex: 1; -webkit-appearance: none; background: var(--border); height: 6px; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); cursor: pointer; }
        .val-badge { font-size: 1.1rem; font-weight: 700; color: white; min-width: 45px; background: var(--primary); padding: 4px 8px; border-radius: 6px; }

        /* Board */
        .status-text { font-size: 1.4rem; font-weight: 700; color: white; margin-bottom: 5px; }
        .board { display: grid; gap: 8px; margin: 20px auto; width: 100%; max-width: 320px; }
        .cell {
            background-color: var(--bg-input); border-radius: 8px; border: 2px solid var(--border);
            display: flex; justify-content: center; align-items: center; font-weight: 900;
            cursor: pointer; aspect-ratio: 1 / 1; transition: 0.1s ease; user-select: none;
        }
        .cell:active { transform: scale(0.95); }
        .cell.x { color: var(--danger); }
        .cell.o { color: var(--success); }
        .win-highlight { background-color: var(--primary); border-color: white; color: white !important; }

        /* Timer */
        #timer-container { display: none; width: 100%; height: 6px; background: var(--bg-input); border-radius: 3px; margin: 10px 0; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background-color: var(--success); transition: width 1s linear; }

        /* Chat System */
        .chat-container { width: 100%; height: 160px; background: var(--bg-input); border-radius: 8px; display: none; flex-direction: column; margin-top: 20px; border: 1px solid var(--border); overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 0.85rem;}
        .chat-msg { background: var(--bg-card); padding: 8px 12px; border-radius: 6px; word-wrap: break-word; color: #cbd5e1; }
        .chat-msg span { font-weight: 700; color: var(--primary); margin-right: 5px; }
        .chat-input-area { display: flex; border-top: 1px solid var(--border); background: var(--bg-card); }
        .chat-input-area input { margin: 0; border: none; border-radius: 0; background: transparent; padding: 12px; flex: 1; font-size: 0.9rem;}
        .chat-input-area button { background: var(--primary); color: white; border: none; padding: 0 15px; font-weight: 700; cursor: pointer; }

        /* Modals & Toasts */
        .popup { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); z-index: 200; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center; min-width: 320px; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 24px; border-radius: 8px; display: none; z-index: 1000; font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        #celebration-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .winner-msg { font-size: 3rem; font-weight: 900; color: white; text-align: center; margin-bottom: 10px; }
        
    </style>
</head>
<body>

    <div id="toast">Message</div>

    <div id="auth-screen" class="screen active">
        <div class="container">
            <h1>TIC TAC TOE</h1>
            <p class="subtitle">Log in to play multiplayer</p>
            <span class="label">Email Address</span>
            <input type="email" id="email" placeholder="player@game.com">
            <span class="label">Password</span>
            <input type="password" id="password" placeholder="Min 6 characters">
            <button class="btn-main" id="login-btn">Secure Login</button>
        </div>
    </div>

    <div id="home-screen" class="screen">
        <div class="container">
            <h2>Game Setup</h2>
            <p class="subtitle" style="margin-top:-15px;">Playing as: <strong id="user-name" style="color:var(--primary);">---</strong></p>
            
            <span class="label">Game Mode</span>
            <div class="btn-group">
                <button class="btn" id="btn-1p" onclick="setMode('1p')">CPU</button>
                <button class="btn" id="btn-2p" onclick="setMode('2p')">Local</button>
                <button class="btn active" id="btn-online" onclick="setMode('online')">Online</button>
            </div>

            <div id="online-group" class="invite-box">
                <span class="label" style="text-align: center;">Share this code with friend</span>
                <div class="invite-code-text" id="my-invite-code">------</div>
                <input type="text" id="friend-code" placeholder="Or enter friend's code here" style="margin-top: 15px; margin-bottom: 0;">
            </div>

            <span class="label">Turn Timer</span>
            <div class="btn-group">
                <button class="btn active" id="btn-timer-off" onclick="setTimer('off')">Off</button>
                <button class="btn" id="btn-timer-10" onclick="setTimer(10)">10s</button>
                <button class="btn" id="btn-timer-15" onclick="setTimer(15)">15s</button>
            </div>

            <span class="label">Grid Size</span>
            <div class="slider-container">
                <input type="range" id="grid-slider" min="3" max="6" value="3" oninput="updateGridDisplay(this.value)">
                <div class="val-badge"><span id="g-val">3</span>x<span id="g-val2">3</span></div>
            </div>

            <span class="label">Matches to Win</span>
            <div class="slider-container">
                <input type="range" id="win-slider" min="3" max="3" value="3" oninput="updateWinDisplay(this.value)">
                <div class="val-badge" id="w-val">3</div>
            </div>

            <button class="btn-main" id="start-game-btn" onclick="handleStartBtn()">Invite & Start</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="container">
            <div class="status-text" id="status-text">Player X Turn</div>
            <p class="label" id="rule-display" style="text-align: center;">Match 3 to win</p>
            
            <div id="timer-container"><div id="timer-bar"></div></div>
            
            <div class="board" id="board"></div> 
            
            <div class="btn-group" style="margin-bottom: 0;">
                <button class="btn" id="restart-btn" onclick="requestRestart()" style="display: none; background: var(--primary); color: white; border: none;">Play Again</button>
                <button class="btn btn-danger" onclick="leaveGame()">Leave Game</button>
            </div>

            <div class="chat-container" id="chat-container">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type a message...">
                    <button id="send-chat">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="invite-popup" class="popup">
        <h2 style="margin-bottom: 10px;">Game Invite!</h2>
        <p class="subtitle"><strong id="inviter-name" style="color: var(--primary);">Someone</strong> wants to play.</p>
        <div class="btn-group" style="margin-bottom: 0;">
            <button class="btn" style="background: var(--success); color: white; border:none;" id="accept-invite">Accept</button>
            <button class="btn btn-danger" id="reject-invite">Decline</button>
        </div>
    </div>

    <div id="celebration-screen">
        <div class="winner-msg" id="winner-msg-text">Player X Wins!</div>
        <p class="subtitle" id="sub-msg-text" style="color: white; font-size: 1.2rem;"></p>
        <button class="btn-main" style="width: auto; padding: 12px 40px; margin-top: 20px;" onclick="closeCelebration()">Continue</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, onSnapshot, getDocs, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBldLyB9d18ZGStroUC0-yjuUrp31DFQ28",
            authDomain: "online-tic-tac-toe-d919f.firebaseapp.com",
            projectId: "online-tic-tac-toe-d919f",
            storageBucket: "online-tic-tac-toe-d919f.firebasestorage.app",
            messagingSenderId: "644365665798",
            appId: "1:644365665798:web:f90b64bdc3aa6912032587"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Globals
        window.mode = 'online'; window.size = 3; window.winLength = 3; window.timerSetting = 'off';
        let boardState = [], currentPlayer = 'X', gameActive = false, timerInterval, timeLeft;
        let currentUser = null, myProfile = null, currentGameId = null, mySymbol = 'X'; 
        let unsubscribeGame = null, unsubscribeChat = null;

        // Utils
        const switchScreen = (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); };
        const showToast = (msg) => { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); };
        const generateInviteCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();

        // UI Setters
        window.setMode = (m) => {
            window.mode = m;
            ['1p', '2p', 'online'].forEach(x => document.getElementById(`btn-${x}`).classList.toggle('active', x === m));
            document.getElementById('online-group').style.display = m === 'online' ? 'block' : 'none';
            document.getElementById('start-game-btn').innerText = m === 'online' ? 'Invite & Start' : 'Start Offline Game';
        };
        window.setTimer = (t) => { window.timerSetting = t; ['off', '10', '15'].forEach(x => document.getElementById(`btn-timer-${x}`).classList.toggle('active', x == t)); };
        window.updateGridDisplay = (val) => {
            window.size = parseInt(val); document.getElementById('g-val').innerText = window.size; document.getElementById('g-val2').innerText = window.size;
            const w = document.getElementById('win-slider'); w.max = window.size; if (parseInt(w.value) > window.size) w.value = window.size; window.updateWinDisplay(w.value);
        };
        window.updateWinDisplay = (val) => { window.winLength = parseInt(val); document.getElementById('w-val').innerText = window.winLength; };

        // Auth
        document.getElementById('login-btn').addEventListener('click', async () => {
            const e = document.getElementById('email').value, p = document.getElementById('password').value;
            if(!e || !p) return showToast("Enter email and password!");
            document.getElementById('login-btn').innerText = "Loading...";
            try { await signInWithEmailAndPassword(auth, e, p); showToast("Welcome back!"); } 
            catch (err) {
                if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                    try { await createUserWithEmailAndPassword(auth, e, p); showToast("Account created successfully!"); } 
                    catch(e2) { showToast(e2.message); }
                } else { showToast(err.message); }
            }
            document.getElementById('login-btn').innerText = "Secure Login";
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userRef = doc(db, 'users', user.uid);
                const docSnap = await getDoc(userRef);
                if (docSnap.exists()) { myProfile = docSnap.data(); } 
                else { myProfile = { uid: user.uid, name: user.email.split('@')[0], inviteCode: generateInviteCode() }; await setDoc(userRef, myProfile); }
                
                document.getElementById('user-name').innerText = myProfile.name;
                document.getElementById('my-invite-code').innerText = myProfile.inviteCode;
                switchScreen('home-screen'); listenForInvites();
            } else { switchScreen('auth-screen'); }
        });

        // Lobby & Invites
        window.handleStartBtn = async () => {
            if (window.mode === 'online') {
                const fCode = document.getElementById('friend-code').value.toUpperCase();
                if(!fCode) return showToast("Enter friend's code!");
                if(fCode === myProfile.inviteCode) return showToast("Can't invite yourself!");

                const snap = await getDocs(query(collection(db, "users"), where("inviteCode", "==", fCode)));
                if(!snap.empty) {
                    const friend = snap.docs[0].data(); showToast("Invite sent! Waiting for response...");
                    const invRef = await addDoc(collection(db, 'invites'), {
                        senderUid: currentUser.uid, senderName: myProfile.name, receiverUid: friend.uid, status: 'pending',
                        settings: { size: window.size, winLength: window.winLength, timerSetting: window.timerSetting }
                    });
                    
                    onSnapshot(doc(db, 'invites', invRef.id), (dSnap) => {
                        const data = dSnap.data();
                        if(data?.status === 'accepted' && data.gameId) { startOnlineGame(data.gameId, 'X'); deleteDoc(doc(db, 'invites', invRef.id)); } 
                        else if (data?.status === 'rejected') showToast("Invite declined!");
                    });
                } else showToast("Player not found!");
            } else { document.getElementById('chat-container').style.display = 'none'; switchScreen('game-screen'); initBoard(); }
        };

        function listenForInvites() {
            onSnapshot(query(collection(db, 'invites'), where('receiverUid', '==', currentUser.uid), where('status', '==', 'pending')), (snap) => {
                snap.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const inv = change.doc.data();
                        document.getElementById('inviter-name').innerText = inv.senderName;
                        document.getElementById('invite-popup').style.display = 'block';
                        
                        document.getElementById('accept-invite').onclick = async () => {
                            window.size = inv.settings.size; window.winLength = inv.settings.winLength; window.timerSetting = inv.settings.timerSetting;
                            const gRef = await addDoc(collection(db, 'games'), {
                                players: [inv.senderUid, currentUser.uid], board: Array(window.size * window.size).fill(""),
                                turn: 'X', status: 'playing', size: window.size, winLength: window.winLength, timerSetting: window.timerSetting
                            });
                            await updateDoc(doc(db, 'invites', change.doc.id), { status: 'accepted', gameId: gRef.id });
                            document.getElementById('invite-popup').style.display = 'none';
                            startOnlineGame(gRef.id, 'O');
                        };
                        document.getElementById('reject-invite').onclick = async () => {
                            await updateDoc(doc(db, 'invites', change.doc.id), { status: 'rejected' });
                            document.getElementById('invite-popup').style.display = 'none';
                        };
                    }
                });
            });
        }

        // Online Game Logic & OPPONENT LEAVE/AUTO-DELETE
        function startOnlineGame(gameId, symbol) {
            currentGameId = gameId; mySymbol = symbol;
            document.getElementById('chat-container').style.display = 'flex';
            switchScreen('game-screen');
            
            unsubscribeGame = onSnapshot(doc(db, 'games', gameId), (docSnap) => {
                // OPPONENT LEFT LOGIC
                if(!docSnap.exists()) {
                    if(gameActive) { showToast("Opponent left the game!"); window.leaveGame(true); }
                    return;
                }
                
                const game = docSnap.data();
                window.size = game.size; window.winLength = game.winLength; window.timerSetting = game.timerSetting;
                boardState = game.board; currentPlayer = game.turn; gameActive = game.status === 'playing';
                
                renderBoardUI();
                
                if(game.status === 'win') handleWinUI(game.winner);
                else if(game.status === 'draw') handleDrawUI();
                else if(game.status === 'timeout') handleWinUI(game.winner, `Opponent ran out of time!`);
                else {
                    document.getElementById('status-text').innerText = currentPlayer === mySymbol ? "Your Turn!" : "Opponent's Turn";
                    document.getElementById('status-text').style.color = currentPlayer === mySymbol ? "var(--success)" : "white";
                    startTurnTimer(); 
                }
            });

            unsubscribeChat = onSnapshot(query(collection(db, `games/${gameId}/chat`)), (snap) => {
                const box = document.getElementById('chat-messages'); box.innerHTML = ''; let msgs = [];
                snap.forEach(d => msgs.push(d.data()));
                msgs.sort((a,b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0)).forEach(m => {
                    box.innerHTML += `<div class="chat-msg"><span>${m.sender}:</span> ${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // Board Render
        window.initBoard = () => {
            clearInterval(timerInterval); boardState = Array(window.size * window.size).fill("");
            currentPlayer = 'X'; gameActive = true; document.getElementById('restart-btn').style.display = 'none';
            renderBoardUI(); document.getElementById('status-text').innerText = "Player X Turn"; startTurnTimer();
        };

        function renderBoardUI() {
            document.getElementById('rule-display').innerText = `MATCH ${window.winLength} TO WIN`;
            if(window.timerSetting !== 'off') { document.getElementById('timer-container').style.display = 'block'; }
            else { document.getElementById('timer-container').style.display = 'none'; }

            const b = document.getElementById('board'); b.style.gridTemplateColumns = `repeat(${window.size}, 1fr)`; b.innerHTML = '';
            let fSize = window.size <= 4 ? 2.5 : 1.8;

            for(let i=0; i < window.size * window.size; i++) {
                const cell = document.createElement('div');
                cell.className = `cell ${boardState[i] !== '' ? boardState[i].toLowerCase() : ''}`;
                cell.dataset.idx = i; cell.style.fontSize = `${fSize}rem`; cell.innerText = boardState[i];
                cell.addEventListener('click', () => handleMove(i)); b.appendChild(cell);
            }
        }

        // Movement (X plays X bug fixed)
        window.handleMove = async (idx) => {
            if(!gameActive || boardState[idx] !== "") return;
            if (window.mode === 'online') {
                if(currentPlayer !== mySymbol) return showToast("Not your turn!");
                boardState[idx] = mySymbol; const res = checkWinOrDraw(boardState);
                if (res === 'win') await updateDoc(doc(db, 'games', currentGameId), { board: boardState, status: 'win', winner: mySymbol });
                else if (res === 'draw') await updateDoc(doc(db, 'games', currentGameId), { board: boardState, status: 'draw' });
                else await updateDoc(doc(db, 'games', currentGameId), { board: boardState, turn: mySymbol === 'X' ? 'O' : 'X' });
            } else {
                boardState[idx] = currentPlayer; const res = checkWinOrDraw(boardState);
                if (res === 'win') handleWinUI(currentPlayer); else if (res === 'draw') handleDrawUI();
                else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    document.getElementById('status-text').innerText = `Player ${currentPlayer} Turn`;
                    renderBoardUI(); startTurnTimer();
                    if (window.mode === '1p' && currentPlayer === 'O') { gameActive = false; setTimeout(cpuMove, 600); }
                }
            }
        };

        // Timer
        function startTurnTimer() {
            if(window.timerSetting === 'off' || !gameActive) return;
            if(window.mode === '1p' && currentPlayer === 'O') { document.getElementById('timer-bar').style.width = '100%'; return; }

            clearInterval(timerInterval); timeLeft = parseInt(window.timerSetting); updateTimerUI();
            timerInterval = setInterval(async () => {
                timeLeft--; updateTimerUI();
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if(window.mode === 'online' && currentPlayer === mySymbol && gameActive) {
                        gameActive = false; await updateDoc(doc(db, 'games', currentGameId), { status: 'timeout', winner: mySymbol === 'X' ? 'O' : 'X' });
                    } else if (window.mode !== 'online') { handleWinUI(currentPlayer === 'X' ? 'O' : 'X', "Time Out!"); }
                }
            }, 1000);
        }

        function updateTimerUI() {
            const bar = document.getElementById('timer-bar');
            bar.style.width = `${(timeLeft / parseInt(window.timerSetting)) * 100}%`;
            bar.style.backgroundColor = timeLeft <= 3 ? "var(--danger)" : "var(--success)";
        }

        // Logic & End
        function checkWinOrDraw(board) { let w = getWinningCells(currentPlayer, board); if(w) return 'win'; if(!board.includes("")) return 'draw'; return 'continue'; }

        function getWinningCells(p, b) {
            let s = window.size, wl = window.winLength;
            for(let r=0; r<s; r++) for(let c=0; c<=s-wl; c++) { let a=[]; for(let i=0; i<wl; i++) if(b[r*s+(c+i)]===p) a.push(r*s+(c+i)); if(a.length===wl) return a; }
            for(let c=0; c<s; c++) for(let r=0; r<=s-wl; r++) { let a=[]; for(let i=0; i<wl; i++) if(b[(r+i)*s+c]===p) a.push((r+i)*s+c); if(a.length===wl) return a; }
            for(let r=0; r<=s-wl; r++) for(let c=0; c<=s-wl; c++) { let a=[]; for(let i=0; i<wl; i++) if(b[(r+i)*s+(c+i)]===p) a.push((r+i)*s+(c+i)); if(a.length===wl) return a; }
            for(let r=0; r<=s-wl; r++) for(let c=wl-1; c<s; c++) { let a=[]; for(let i=0; i<wl; i++) if(b[(r+i)*s+(c-i)]===p) a.push((r+i)*s+(c-i)); if(a.length===wl) return a; }
            return null;
        }

        function handleWinUI(winner, msg = "") {
            gameActive = false; clearInterval(timerInterval); renderBoardUI();
            let wc = getWinningCells(winner, boardState);
            if(wc) wc.forEach(i => document.querySelector(`.cell[data-idx='${i}']`)?.classList.add('win-highlight'));
            
            setTimeout(() => {
                let msgText = winner === 'O' && window.mode === '1p' ? "CPU Wins!" : `Player ${winner} Wins!`;
                if (window.mode === 'online') msgText = winner === mySymbol ? "You Win! 🎉" : "You Lost! 💔";
                
                document.getElementById('winner-msg-text').innerText = msgText;
                document.getElementById('sub-msg-text').innerText = msg;
                document.getElementById('celebration-screen').style.display = 'flex';
                document.getElementById('restart-btn').style.display = 'block';
                if(winner === mySymbol || window.mode !== 'online') confetti({ particleCount: 100, spread: 70, zIndex: 200 });
            }, 500);
        }

        function handleDrawUI() {
            gameActive = false; clearInterval(timerInterval); renderBoardUI();
            document.getElementById('status-text').innerText = "Draw!"; document.getElementById('restart-btn').style.display = 'block';
        }

        // CPU Move
        function cpuMove() {
            if(!gameActive) return; gameActive = true;
            let move = -1, empty = boardState.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if(move === -1) move = empty[Math.floor(Math.random() * empty.length)];
            window.handleMove(move);
        }

        // Leave & Cleanup Logic
        window.leaveGame = async (isForced = false) => {
            if (!isForced && window.mode === 'online' && currentGameId) {
                // AUTO DELETE GAME & CHAT
                try {
                    const chatSnaps = await getDocs(query(collection(db, `games/${currentGameId}/chat`)));
                    chatSnaps.forEach((d) => deleteDoc(doc(db, `games/${currentGameId}/chat`, d.id)));
                    await deleteDoc(doc(db, 'games', currentGameId));
                } catch(e) { console.error("Error deleting:", e); }
            }
            if(unsubscribeGame) unsubscribeGame(); if(unsubscribeChat) unsubscribeChat();
            currentGameId = null; gameActive = false; switchScreen('home-screen');
        };

        window.requestRestart = async () => {
            if(window.mode === 'online') await updateDoc(doc(db, 'games', currentGameId), { board: Array(window.size * window.size).fill(""), status: 'playing', turn: 'X' });
            else window.initBoard();
        };

        window.closeCelebration = () => { document.getElementById('celebration-screen').style.display = 'none'; };

        // Chat
        document.getElementById('send-chat').addEventListener('click', async () => {
            const input = document.getElementById('chat-input');
            if(input.value.trim() !== '' && window.mode === 'online') {
                await addDoc(collection(db, `games/${currentGameId}/chat`), { sender: myProfile.name, text: input.value, timestamp: serverTimestamp() });
                input.value = '';
            }
        });
        document.getElementById('chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('send-chat').click(); });
    </script>
</body>
</html>
