<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="Za1pEupQLM-LlPnODka_5pMgrC6DyOzmuDaZBepfg7Q" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe – AlignIt Style</title>
    <!-- Chalk font + clean body font -->
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* prevents accidental text selection on taps */
        }

        :root {
            --chalkboard-dark: #1a2a2f;
            --chalk-line: rgba(255, 255, 255, 0.4);
            --x-color: #ff4757;
            --o-color: #2ed573;
            --glow-white: rgba(255, 255, 255, 0.3);
        }

        body {
            background-color: var(--chalkboard-dark);
            /* authentic chalkboard texture (subtle grain) */
            background-image: radial-gradient(circle, rgba(255,255,240,0.07) 1px, transparent 1px);
            background-size: 22px 22px;
            background-position: 0 0;
            font-family: 'Poppins', sans-serif;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* screens */
        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            backdrop-filter: blur(2px);
        }
        .active { display: flex; }

        h1, h2, .chalk-text {
            font-family: 'Permanent Marker', cursive;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        h2 { font-size: 2rem; margin-bottom: 1.5rem; }

        input {
            width: 100%;
            max-width: 280px;
            padding: 12px 18px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--chalk-line);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #fff;
            box-shadow: 0 0 12px var(--glow-white);
        }

        .btn {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            max-width: 280px;
            margin: 6px auto;
            font-family: 'Poppins', sans-serif;
        }
        .btn:hover, .btn:active {
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 12px rgba(255,255,255,0.3);
        }
        .btn-action {
            background: var(--o-color);
            border: none;
            color: #111;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(46,213,115,0.4);
        }
        .btn-danger {
            border-color: var(--x-color);
            color: var(--x-color);
        }

        .invite-box {
            background: rgba(0,0,0,0.5);
            border-radius: 24px;
            padding: 14px 20px;
            margin: 20px 0;
            text-align: center;
            border: 1px dashed var(--chalk-line);
            width: 100%;
            max-width: 280px;
        }
        .invite-code {
            font-family: 'Permanent Marker', cursive;
            font-size: 2rem;
            color: #ffdd88;
            letter-spacing: 4px;
        }

        /* GAME BOARD – CHALK GRID */
        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .status-area {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            background: rgba(0,0,0,0.4);
            padding: 6px 20px;
            border-radius: 60px;
            letter-spacing: 1px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            width: 80vw;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            background: transparent;
        }
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 4px solid var(--chalk-line);
            transition: 0.1s linear;
        }
        /* clean chalkboard grid – outer borders removed */
        .cell[data-index="0"], .cell[data-index="1"], .cell[data-index="2"] { border-top: none; }
        .cell[data-index="6"], .cell[data-index="7"], .cell[data-index="8"] { border-bottom: none; }
        .cell[data-index="0"], .cell[data-index="3"], .cell[data-index="6"] { border-left: none; }
        .cell[data-index="2"], .cell[data-index="5"], .cell[data-index="8"] { border-right: none; }
        .cell:hover { background: rgba(255,255,255,0.05); }

        /* SVG ICONS – DRAWING ANIMATIONS */
        .svg-icon {
            width: 70%;
            height: 70%;
        }

        /* X – two strokes, second stroke delayed */
        .path-x {
            stroke-dasharray: 140;
            stroke-dashoffset: 140;
            animation: drawChalk 0.4s ease-out forwards;
        }
        .path-x-delay {
            stroke-dasharray: 140;
            stroke-dashoffset: 140;
            animation: drawChalk 0.4s ease-out 0.18s forwards;
        }

        /* O – perfect circle draw */
        .path-o {
            stroke-dasharray: 220;   /* circumference of circle r=35 => 2*π*35 ≈ 220 */
            stroke-dashoffset: 220;
            animation: drawChalk 0.55s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        @keyframes drawChalk {
            to { stroke-dashoffset: 0; }
        }

        /* Chat section */
        .chat-wrapper {
            width: 100%;
            max-width: 340px;
            background: rgba(0,0,0,0.45);
            border-radius: 24px;
            margin-top: 20px;
            backdrop-filter: blur(2px);
            border: 1px solid var(--chalk-line);
            overflow: hidden;
        }
        .chat-messages {
            height: 110px;
            overflow-y: auto;
            padding: 8px 12px;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .chat-msg {
            background: rgba(255,255,200,0.08);
            padding: 5px 10px;
            border-radius: 20px;
            width: fit-content;
            max-width: 90%;
        }
        .chat-msg span { color: #ffdd88; font-weight: bold; margin-right: 6px; }
        .chat-input-area {
            display: flex;
            border-top: 1px solid var(--chalk-line);
        }
        .chat-input-area input {
            margin: 0;
            border: none;
            border-radius: 0;
            background: transparent;
            padding: 10px;
            text-align: left;
        }
        .chat-input-area button {
            background: var(--chalk-line);
            border: none;
            padding: 0 18px;
            font-weight: bold;
            cursor: pointer;
            color: black;
        }

        /* Modals */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(6px);
        }
        .modal {
            background: #1e2a2f;
            padding: 28px 20px;
            border-radius: 32px;
            border: 2px solid white;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 0 30px rgba(255,255,200,0.2);
        }
        .winner-text {
            font-family: 'Permanent Marker', cursive;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 15px currentColor;
        }
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: #ffdd88;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 300;
            display: none;
            font-family: monospace;
            white-space: nowrap;
            box-shadow: 0 2px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<div id="toast">✨ Message</div>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="screen active">
    <h1 class="chalk-text">TIC TAC TOE</h1>
    <p style="margin-bottom: 24px;">⚡ Multiplayer Edition</p>
    <input type="email" id="email" placeholder="Email address">
    <input type="password" id="password" placeholder="Password (min 6)">
    <button class="btn btn-action" id="login-btn">PLAY NOW</button>
</div>

<!-- HOME / LOBBY -->
<div id="home-screen" class="screen">
    <h2 class="chalk-text">LOBBY</h2>
    <p>👤 <strong id="user-name" style="color: #ffdd88;">---</strong></p>
    <div class="invite-box">
        <div style="font-size: 0.8rem;">YOUR INVITE CODE</div>
        <div class="invite-code" id="my-invite-code">------</div>
    </div>
    <input type="text" id="friend-code" placeholder="Enter friend's code">
    <button class="btn btn-action" onclick="window.handleInvite()">SEND CHALLENGE</button>
    <button class="btn" style="margin-top: 18px;" onclick="window.playOffline()">✏️ PRACTICE (OFFLINE)</button>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" class="screen">
    <div class="board-container">
        <div class="status-area" id="status-text">YOUR TURN</div>
        <div class="board" id="board">
            <!-- 9 cells dynamically -->
        </div>
        <div class="chat-wrapper" id="chat-container" style="display: none;">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Chalk a message...">
                <button id="send-chat">SEND</button>
            </div>
        </div>
        <button class="btn btn-danger" style="margin-top: 18px;" onclick="window.leaveGame()">LEAVE MATCH</button>
    </div>
</div>

<!-- INVITE POPUP -->
<div id="invite-popup" class="overlay">
    <div class="modal">
        <h2 class="chalk-text">⚡ CHALLENGE!</h2>
        <p><strong id="inviter-name" style="color: #ffdd88;">Someone</strong> invited you to play.</p>
        <button class="btn btn-action" id="accept-invite">ACCEPT</button>
        <button class="btn btn-danger" id="reject-invite">DECLINE</button>
    </div>
</div>

<!-- WIN / DRAW CELEBRATION -->
<div id="celebration-screen" class="overlay">
    <div class="modal">
        <div class="winner-text" id="winner-msg-text">WINNER!</div>
        <button class="btn btn-action" id="rematch-btn" onclick="window.requestRestart()">PLAY AGAIN</button>
        <button class="btn" onclick="window.leaveGame()">BACK TO LOBBY</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script type="module">
    // ----------------------------- FIREBASE INIT -----------------------------
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, onSnapshot, getDocs, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBldLyB9d18ZGStroUC0-yjuUrp31DFQ28",
        authDomain: "online-tic-tac-toe-d919f.firebaseapp.com",
        projectId: "online-tic-tac-toe-d919f",
        storageBucket: "online-tic-tac-toe-d919f.firebasestorage.app",
        messagingSenderId: "644365665798",
        appId: "1:644365665798:web:f90b64bdc3aa6912032587"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ----------------------------- SVG DRAWING ICONS -----------------------------
    const svgX = `<svg class="svg-icon" viewBox="0 0 100 100"><path class="path-x" d="M 20 20 L 80 80" stroke="#ff4757" stroke-width="12" stroke-linecap="round" fill="none"/><path class="path-x-delay" d="M 80 20 L 20 80" stroke="#ff4757" stroke-width="12" stroke-linecap="round" fill="none"/></svg>`;
    const svgO = `<svg class="svg-icon" viewBox="0 0 100 100"><circle class="path-o" cx="50" cy="50" r="35" stroke="#2ed573" stroke-width="12" fill="none" stroke-linecap="round"/></svg>`;

    // ----------------------------- GLOBAL STATE -----------------------------
    let currentUser = null;
    let myProfile = null;
    let mode = 'online';          // 'online' or 'offline'
    let boardState = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';     // 'X' always starts
    let gameActive = false;
    let mySymbol = 'X';           // only used in online
    let currentGameId = null;
    let unsubscribeGame = null;
    let unsubscribeChat = null;

    // helper functions
    const showToast = (msg) => {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2800);
    };
    const switchScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };
    const generateInviteCode = () => Math.random().toString(36).substring(2, 6).toUpperCase();

    // ----------------------------- WIN / DRAW LOGIC -----------------------------
    function checkWinOrDraw(board) {
        const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for (let p of winPatterns) {
            if (board[p[0]] && board[p[0]] === board[p[1]] && board[p[0]] === board[p[2]]) return 'win';
        }
        return board.includes('') ? 'continue' : 'draw';
    }

    // ----------------------------- RENDER BOARD WITH SVG + ANIMATION -----------------------------
    function renderBoardUI() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach((cell, i) => {
            const val = boardState[i];
            if (val === 'X' && !cell.innerHTML.includes('path-x')) cell.innerHTML = svgX;
            else if (val === 'O' && !cell.innerHTML.includes('path-o')) cell.innerHTML = svgO;
            else if (val === '') cell.innerHTML = '';
        });
    }

    // ----------------------------- OFFLINE MODE -----------------------------
    function initOfflineBoard() {
        boardState = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        gameActive = true;
        document.getElementById('celebration-screen').style.display = 'none';
        document.getElementById('status-text').innerText = "PLAYER X TURN";
        document.getElementById('status-text').style.color = "#fff";
        renderBoardUI();
    }

    window.playOffline = () => {
        mode = 'offline';
        document.getElementById('chat-container').style.display = 'none';
        switchScreen('game-screen');
        initOfflineBoard();
    };

    // win/draw UI (with animation delay)
    function handleWinUI(winner, winnerSymbol = null) {
        gameActive = false;
        renderBoardUI();
        setTimeout(() => {
            let msg = (mode === 'online') ? (winner === mySymbol ? "YOU WIN!" : "OPPONENT WINS!") : `PLAYER ${winner} WINS!`;
            document.getElementById('winner-msg-text').innerText = msg;
            const winnerColor = (winnerSymbol === 'X' || winner === 'X') ? 'var(--x-color)' : 'var(--o-color)';
            document.getElementById('winner-msg-text').style.color = winnerColor;
            document.getElementById('celebration-screen').style.display = 'flex';
            if ((mode === 'online' && winner === mySymbol) || mode === 'offline') {
                canvasConfetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, startVelocity: 15 });
            }
        }, 600);
    }
    function handleDrawUI() {
        gameActive = false;
        renderBoardUI();
        setTimeout(() => {
            document.getElementById('winner-msg-text').innerText = "DRAW!";
            document.getElementById('winner-msg-text').style.color = "white";
            document.getElementById('celebration-screen').style.display = 'flex';
        }, 600);
    }

    // cell click handler (both modes)
    async function onCellClick(index) {
        if (!gameActive) return;
        if (boardState[index] !== '') return;

        if (mode === 'offline') {
            boardState[index] = currentPlayer;
            renderBoardUI();   // instant SVG draw animation
            const result = checkWinOrDraw(boardState);
            if (result === 'win') handleWinUI(currentPlayer);
            else if (result === 'draw') handleDrawUI();
            else {
                currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
                document.getElementById('status-text').innerText = `PLAYER ${currentPlayer} TURN`;
            }
        } 
        else if (mode === 'online') {
            if (currentPlayer !== mySymbol) {
                showToast("Wait for your turn!");
                return;
            }
            boardState[index] = mySymbol;
            renderBoardUI();   // immediate visual feedback
            const result = checkWinOrDraw(boardState);
            if (result === 'win') {
                await updateDoc(doc(db, 'games', currentGameId), { board: boardState, status: 'win', winner: mySymbol });
            } else if (result === 'draw') {
                await updateDoc(doc(db, 'games', currentGameId), { board: boardState, status: 'draw' });
            } else {
                const nextTurn = (mySymbol === 'X') ? 'O' : 'X';
                await updateDoc(doc(db, 'games', currentGameId), { board: boardState, turn: nextTurn });
            }
        }
    }

    // ----------------------------- ONLINE GAME SYNC -----------------------------
    function startOnlineGame(gameId, symbol) {
        currentGameId = gameId;
        mySymbol = symbol;
        mode = 'online';
        document.getElementById('chat-container').style.display = 'flex';
        switchScreen('game-screen');
        document.getElementById('celebration-screen').style.display = 'none';

        if (unsubscribeGame) unsubscribeGame();
        unsubscribeGame = onSnapshot(doc(db, 'games', gameId), (docSnap) => {
            if (!docSnap.exists()) {
                if (gameActive) showToast("Opponent left the game");
                window.leaveGame(true);
                return;
            }
            const game = docSnap.data();
            boardState = game.board;
            currentPlayer = game.turn;
            gameActive = (game.status === 'playing');
            renderBoardUI();

            if (game.status === 'win') handleWinUI(game.winner, game.winner);
            else if (game.status === 'draw') handleDrawUI();
            else {
                const statusDiv = document.getElementById('status-text');
                if (currentPlayer === mySymbol) {
                    statusDiv.innerText = "✨ YOUR TURN";
                    statusDiv.style.color = "#2ed573";
                } else {
                    statusDiv.innerText = "⏳ OPPONENT'S TURN";
                    statusDiv.style.color = "#f0f0f0";
                }
            }
        });

        // Chat listener
        if (unsubscribeChat) unsubscribeChat();
        unsubscribeChat = onSnapshot(query(collection(db, `games/${gameId}/chat`)), (snap) => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            const msgs = [];
            snap.forEach(d => msgs.push(d.data()));
            msgs.sort((a,b) => (a.timestamp?.toMillis()||0) - (b.timestamp?.toMillis()||0)).forEach(m => {
                container.innerHTML += `<div class="chat-msg"><span>${m.sender}:</span> ${m.text}</div>`;
            });
            container.scrollTop = container.scrollHeight;
        });
    }

    // leave game & cleanup
    window.leaveGame = async (isForced = false) => {
        if (!isForced && mode === 'online' && currentGameId) {
            try {
                const chats = await getDocs(query(collection(db, `games/${currentGameId}/chat`)));
                for (const c of chats.docs) await deleteDoc(doc(db, `games/${currentGameId}/chat`, c.id));
                await deleteDoc(doc(db, 'games', currentGameId));
            } catch(e) { console.warn(e); }
        }
        if (unsubscribeGame) unsubscribeGame();
        if (unsubscribeChat) unsubscribeChat();
        currentGameId = null;
        gameActive = false;
        document.getElementById('celebration-screen').style.display = 'none';
        switchScreen('home-screen');
    };

    window.requestRestart = async () => {
        if (mode === 'online' && currentGameId) {
            document.getElementById('celebration-screen').style.display = 'none';
            await updateDoc(doc(db, 'games', currentGameId), {
                board: ['', '', '', '', '', '', '', '', ''],
                status: 'playing',
                turn: 'X'
            });
        } else if (mode === 'offline') {
            initOfflineBoard();
            document.getElementById('celebration-screen').style.display = 'none';
        }
    };

    // ----------------------------- INVITE SYSTEM -----------------------------
    window.handleInvite = async () => {
        mode = 'online';
        const fCode = document.getElementById('friend-code').value.toUpperCase().trim();
        if (!fCode) return showToast("Enter friend's invite code");
        if (fCode === myProfile.inviteCode) return showToast("That's your own code!");

        const qSnap = await getDocs(query(collection(db, "users"), where("inviteCode", "==", fCode)));
        if (qSnap.empty) return showToast("No player with that code");
        const friend = qSnap.docs[0].data();
        const invRef = await addDoc(collection(db, 'invites'), {
            senderUid: currentUser.uid,
            senderName: myProfile.name,
            receiverUid: friend.uid,
            status: 'pending'
        });
        showToast("Challenge sent! Waiting for response...");
        onSnapshot(doc(db, 'invites', invRef.id), (docSnap) => {
            const data = docSnap.data();
            if (data?.status === 'accepted' && data.gameId) {
                startOnlineGame(data.gameId, 'X');
                deleteDoc(doc(db, 'invites', invRef.id));
            } else if (data?.status === 'rejected') {
                showToast("Friend declined the challenge");
                deleteDoc(doc(db, 'invites', invRef.id));
            }
        });
    };

    function listenForInvites() {
        onSnapshot(query(collection(db, 'invites'), where('receiverUid', '==', currentUser?.uid), where('status', '==', 'pending')), (snap) => {
            snap.docChanges().forEach(async (change) => {
                if (change.type === 'added') {
                    const inv = change.doc.data();
                    document.getElementById('inviter-name').innerText = inv.senderName;
                    document.getElementById('invite-popup').style.display = 'flex';

                    document.getElementById('accept-invite').onclick = async () => {
                        const gameRef = await addDoc(collection(db, 'games'), {
                            players: [inv.senderUid, currentUser.uid],
                            board: ['','','','','','','','',''],
                            turn: 'X',
                            status: 'playing'
                        });
                        await updateDoc(doc(db, 'invites', change.doc.id), { status: 'accepted', gameId: gameRef.id });
                        document.getElementById('invite-popup').style.display = 'none';
                        startOnlineGame(gameRef.id, 'O');
                    };
                    document.getElementById('reject-invite').onclick = async () => {
                        await updateDoc(doc(db, 'invites', change.doc.id), { status: 'rejected' });
                        document.getElementById('invite-popup').style.display = 'none';
                    };
                }
            });
        });
    }

    // ----------------------------- AUTH & INIT -----------------------------
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if (!email || !pass) return showToast("Enter email & password");
        document.getElementById('login-btn').innerText = "🔄 ...";
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            showToast("Welcome back!");
        } catch (err) {
            if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                try {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    showToast("Account created!");
                } catch (e2) { showToast(e2.message); }
            } else { showToast(err.message); }
        }
        document.getElementById('login-btn').innerText = "PLAY NOW";
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            const userRef = doc(db, 'users', user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) myProfile = snap.data();
            else {
                myProfile = { uid: user.uid, name: user.email.split('@')[0], inviteCode: generateInviteCode() };
                await setDoc(userRef, myProfile);
            }
            document.getElementById('user-name').innerText = myProfile.name;
            document.getElementById('my-invite-code').innerText = myProfile.inviteCode;
            switchScreen('home-screen');
            listenForInvites();
        } else {
            switchScreen('auth-screen');
        }
    });

    // create board cells
    const boardDiv = document.getElementById('board');
    for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('data-index', i);
        cell.addEventListener('click', () => onCellClick(i));
        boardDiv.appendChild(cell);
    }

    // chat functionality
    document.getElementById('send-chat').addEventListener('click', async () => {
        const input = document.getElementById('chat-input');
        if (input.value.trim() && mode === 'online' && currentGameId) {
            await addDoc(collection(db, `games/${currentGameId}/chat`), {
                sender: myProfile.name,
                text: input.value,
                timestamp: serverTimestamp()
            });
            input.value = '';
        }
    });
    document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('send-chat').click();
    });
</script>
</body>
</html>
